<style>
:root{
  --bg:#0b120d;
  --card:#131d16;
  --tx:#f0ede8;
  --mu:#95a398;
  --ac:#3fa56b;
  --ac2:#1a2b1f;
  --gold:#c9a84c;
  --bd:#233527;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font:15px/1.55 'Inter',system-ui,sans-serif;
  padding-bottom:60px;
}
main{max-width:820px;margin:0 auto;padding:16px}
header.top-header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px 0 8px;
  border-bottom:1px solid var(--bd);
  margin-bottom:14px;
}
header.top-header svg{width:42px;height:42px;border-radius:50%}
h1{font-family:'Playfair Display',serif;font-size:1.65rem;margin:0;color:#fff}
h2{font-family:'Playfair Display',serif;font-size:1.25rem;margin:22px 0 10px;color:var(--ac)}
h3{font-size:1rem;margin:0;color:var(--tx)}
p{margin:4px 0;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 4px 16px rgba(0,0,0,0.25)}
.bar{height:8px;background:var(--ac2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--gold));width:0;transition:width .3s}
nav{display:flex;gap:6px;margin:16px 0;overflow-x:auto;padding-bottom:4px}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:none;
  white-space:nowrap;
  padding:9px 14px;
  border:1px solid var(--bd);
  background:var(--card);
  color:var(--mu);
  border-radius:10px;
  font:inherit;
  font-size:.85rem;
  font-weight:600;
  cursor:pointer;
  transition:all .2s;
}
nav button.on{
  background:var(--ac);
  color:#fff;
  border-color:var(--ac);
  box-shadow:0 2px 10px rgba(63,165,107,0.3);
}
.chain{display:grid;gap:8px;counter-reset:c}
.chain div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;counter-increment:c}
.chain div:before{content:counter(c);display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;background:var(--ac);color:#fff;border-radius:50%;font-size:.78rem;margin-right:8px;font-weight:700}
.chain small{display:block;color:var(--mu);margin-left:32px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grid div{background:var(--ac2);border-radius:10px;padding:12px;font-size:.88rem;border:1px solid var(--bd)}
label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer}
label:first-of-type{border-top:0}
input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--ac);flex:none;cursor:pointer}
label.done span{text-decoration:line-through;color:var(--mu)}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:12px 0}
summary{padding:14px 16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
.pct{font-size:.85rem;color:var(--ac);font-weight:700;white-space:nowrap}
.body{padding:0 16px 16px}
.kpi{margin-top:8px;font-size:.88rem;background:var(--ac2);padding:10px 12px;border-radius:8px;border:1px solid var(--bd)}
.tag{font-size:.75rem;background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 8px;margin-left:6px;font-weight:600}
.reset{margin:24px 0;background:none;border:1px solid var(--bd);color:var(--mu);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer}
.chip{margin:3px 4px 3px 0;padding:6px 12px;border-radius:99px;border:1px solid var(--ac);background:none;color:var(--tx);font:inherit;font-size:.82rem}
.chip.part{background:var(--ac2)}.chip.full{background:var(--ac);color:#fff}
.slide{min-height:300px;padding:20px}
.nb{flex:1;padding:12px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.nb.b{background:none;color:var(--ac)}
.dots{text-align:center;margin:14px}.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bd);margin:0 4px;transition:all .2s}.dots i.on{background:var(--ac);width:18px;border-radius:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.zl span{display:inline-block;margin-right:12px;font-size:.82rem;color:var(--mu)}
</style>
</head>

 if(tab=="alto"){h+='<div class="card"><b>⭐ Fazenda da Grama (Itupeva)</b><p>Os anúncios descrevem um dos condomínios mais exclusivos da região, com campo de golfe, praia artificial, restaurantes e segurança 24 horas, projeto da Jack Nicklaus Design. As casas são assinadas por arquitetos, e os anúncios citam nomes como Davi Bastos e Antonio Scarpa. Quem assina a casa influencia o jardim e a manutenção, então arquitetos são um canal direto.</p></div><h2>Condomínios do mesmo nível</h2><div class="card"><p>Citados nos mesmos anúncios de Itupeva: Terras da Alvorada, Fazenda Serra Azul, Ibi Aram, Terras de Santa Teresa e Poema do Japy. Pesquise os nomes das zonas 2 e 3 para completar a lista.</p></div><h2>Oportunidades que passam despercebidas</h2>'+OP.map(function(g){return '<div class="card"><b>'+g[0]+'</b><p>'+g[1]+'</p></div>'}).join("")+'<h2>Parceiros que talvez vocêê não tenha pensado</h2>'+PA.map(function(g){return '<div class="card"><b>'+g[0]+'</b><p>'+g[1]+'</p></div>'}).join("")+'<h2>Ferramentas e plataformas novas</h2><div class="card"><ul>'+TL.map(function(t){return '<li>'+t+'</li>'}).join("")+'</ul></div><h2>Plano de ação alto padrão</h2>'+HP.map(function(g,n){var l=g[1].map(function(_,i){return "h"+n+"_"+i});return '<details id="hp'+n+'"'+(open["hp"+n]?" open":"")+'><summary><h3>'+g[0]+'</h3><span class="pct">'+pct(l)+'%</span></summary><div class="body">'+g[1].map(function(t,i){return chk("h"+n+"_"+i,"<b>"+(i+1)+".</b> "+t)}).join("")+'</div></details>'}).join("");}
